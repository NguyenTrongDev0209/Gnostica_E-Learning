spring.application.name=gnostica-server

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG

# Spring Mail (Gmail) Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=true

# Google configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

# Core PayOS credentials
payos.client-id=${PAYOS_CLIENT_ID}
payos.api-key=${PAYOS_API_KEY}
payos.checksum-key=${PAYOS_CHECKSUM_KEY}

# Optional: Payout credentials
payos.payout-client-id=${PAYOS_PAYOUT_CLIENT_ID}
payos.payout-api-key=${PAYOS_PAYOUT_API_KEY}
payos.payout-checksum-key=${PAYOS_PAYOUT_CHECKSUM_KEY}

# Logging level: DEBUG | INFO | NONE
payos.log-level=NONE

# VNPay payment gateway
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.payment-url=${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.query-url=${VNPAY_QUERY_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/api/payment/vnpay/return}
vnpay.frontend-return-url=${VNPAY_FRONTEND_RETURN_URL:http://localhost:5173/checkout}
vnpay.ipn-url=${VNPAY_IPN_URL:}
vnpay.version=${VNPAY_VERSION:2.1.0}
vnpay.expire-minutes=${VNPAY_EXPIRE_MINUTES:15}
vnpay.polling-interval-ms=${VNPAY_POLLING_INTERVAL_MS:2000}
app.jwt.secret=${JWT_SECRET:your_very_long_and_secure_random_secret_key_here}
app.jwt.expiration=86400000

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# File Upload configuration
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Bunny.net Stream Configuration (Video)
bunny.net.stream.library-id=${BUNNY_STREAM_LIBRARY_ID}
bunny.net.stream.api-key=${BUNNY_STREAM_API_KEY}
bunny.net.stream.pull-zone=vz-e9b6a573-446

# Bunny.net Storage Configuration (Documents)
bunny.net.storage.zone-name=${BUNNY_STORAGE_ZONE_NAME}
bunny.net.storage.api-key=${BUNNY_STORAGE_API_KEY}
bunny.net.storage.pull-zone=gnostica-attachment.b-cdn.net

spring.data.web.pageable.serialization-mode=via-dto

# Redis Cloud Configuration
# Host, port, and password should be provided by your Redis Cloud dashboard
spring.data.redis.host=${REDIS_HOST:redis-16033.c124.us-central1-1.gce.cloud.redislabs.com}
spring.data.redis.port=${REDIS_PORT:16033}
spring.data.redis.password=${REDIS_PASSWORD}

# Draft Configuration
# OpenRouter Configuration
openrouter.api-key=${OPENROUTER_API_KEY}
openrouter.base-url=https://openrouter.ai/api/v1
openrouter.model=google/gemini-2.5-flash-lite
# Timeout in milliseconds (connect: 10s, read: 120s)
openrouter.connect-timeout=10000
openrouter.read-timeout=120000

# DeepSeek Fallback Configuration
deepseek.api-key=${DEEPSEEK_API_KEY:}
deepseek.base-url=https://api.deepseek.com/v1
deepseek.model=deepseek-chat

# MongoDB Configuration
spring.data.mongodb.uri=mongodb+srv://gnostica_user_db_user:gnostica%40123@cluster0.9b993ym.mongodb.net/gnostica?retryWrites=true&w=majority&appName=Cluster0


