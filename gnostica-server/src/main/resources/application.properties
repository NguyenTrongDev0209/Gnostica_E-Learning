spring.data.mongodb.uri=mongodb+srv://gnostica_user_db_user:gnostica%40123@cluster0.9b993ym.mongodb.net/gnostica?retryWrites=true&w=majority&appName=Cluster0



spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
