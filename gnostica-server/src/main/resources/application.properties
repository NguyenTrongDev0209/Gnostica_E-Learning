spring.application.name=gnostica-server

# URLs are selected centrally from APP_ENV in .env (development | production).
app.public-url=${APP_PUBLIC_URL:http://localhost:5173}
app.mobile-oauth-redirect-uri=${APP_MOBILE_OAUTH_REDIRECT_URI:gnostica://auth/callback}
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:${APP_PUBLIC_URL:http://localhost:5173},http://localhost:5173,http://localhost:3000,http://127.0.0.1:*}

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${APP_SQL_LOGGING_ENABLED:false}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=${APP_SQL_LOGGING_ENABLED:false}
spring.jpa.properties.hibernate.jdbc.time_zone=${APP_TIME_ZONE:Asia/Ho_Chi_Minh}
spring.jackson.time-zone=${APP_TIME_ZONE:Asia/Ho_Chi_Minh}

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG

# Spring Mail (Gmail) Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=true

# Google configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:${APP_PUBLIC_URL:http://localhost:8080}/api/login/oauth2/code/{registrationId}}
server.forward-headers-strategy=framework

# Core PayOS credentials
payos.client-id=${PAYOS_CLIENT_ID}
payos.api-key=${PAYOS_API_KEY}
payos.checksum-key=${PAYOS_CHECKSUM_KEY}
# In production, PayOS confirms payments through the public webhook. Development
# uses polling because localhost cannot receive inbound webhooks.
payos.webhook-enabled=${PAYOS_WEBHOOK_ENABLED}
payos.reconciliation-interval-ms=${PAYOS_RECONCILIATION_INTERVAL_MS:30000}
payos.payout-reconciliation-interval-ms=${PAYOS_PAYOUT_RECONCILIATION_INTERVAL_MS:60000}

# Optional: Payout credentials
payos.payout-client-id=${PAYOS_PAYOUT_CLIENT_ID}
payos.payout-api-key=${PAYOS_PAYOUT_API_KEY}
payos.payout-checksum-key=${PAYOS_PAYOUT_CHECKSUM_KEY}

# Logging level: DEBUG | INFO | NONE
payos.log-level=NONE

# VNPay payment gateway
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.payment-url=${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.query-url=${VNPAY_QUERY_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
vnpay.return-url=${VNPAY_RETURN_URL:${APP_PUBLIC_URL:http://localhost:8080}/api/checkout/payments/vnpay/return}
vnpay.frontend-return-url=${VNPAY_FRONTEND_RETURN_URL:${APP_PUBLIC_URL:http://localhost:5173}/checkout}
vnpay.version=${VNPAY_VERSION:2.1.0}
vnpay.expire-minutes=${VNPAY_EXPIRE_MINUTES:5}
# VNPay active orders are reconciled every 2 seconds, up to their expiry.
vnpay.polling-interval-ms=2000
app.jwt.secret=${JWT_SECRET:your_very_long_and_secure_random_secret_key_here}
app.jwt.expiration=86400000
coupon.crypto.master-key=${COUPON_CRYPTO_MASTER_KEY:${JWT_SECRET:change-this-coupon-master-key}}

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# File Upload configuration
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Bunny.net Stream Configuration (Video)
bunny.net.stream.library-id=${BUNNY_STREAM_LIBRARY_ID}
bunny.net.stream.api-key=${BUNNY_STREAM_API_KEY}
bunny.net.stream.pull-zone=vz-e9b6a573-446
# Keep this key only in the server environment. A blank value preserves the
# existing Referer-protected delivery while token authentication is rolled out.
bunny.net.stream.cdn-token-key=${BUNNY_CDN_TOKEN_KEY:}
bunny.net.stream.cdn-token-enabled=${BUNNY_CDN_TOKEN_ENABLED:false}
bunny.net.stream.cdn-token-ttl-seconds=${BUNNY_CDN_TOKEN_TTL_SECONDS:600}
# "Embed view token authentication" signs the player embed view. Bunny uses the
# Video Library API Key as the token security key by default; set an override
# only if the deployment rotates it independently. Enable only when the toggle
# is turned on in the Bunny dashboard to avoid breaking live embeds.
bunny.net.stream.embed-token-key=${BUNNY_EMBED_TOKEN_KEY:}
bunny.net.stream.embed-token-enabled=${BUNNY_EMBED_TOKEN_ENABLED:false}
bunny.net.stream.embed-token-ttl-seconds=${BUNNY_EMBED_TOKEN_TTL_SECONDS:600}

# Bunny.net Storage Configuration (Documents)
bunny.net.storage.zone-name=${BUNNY_STORAGE_ZONE_NAME}
bunny.net.storage.api-key=${BUNNY_STORAGE_API_KEY}

spring.data.web.pageable.serialization-mode=via-dto

# Redis Cloud Configuration
# Host, port, and password should be provided by your Redis Cloud dashboard
spring.data.redis.host=${REDIS_HOST:redis-16033.c124.us-central1-1.gce.cloud.redislabs.com}
spring.data.redis.port=${REDIS_PORT:16033}
spring.data.redis.password=${REDIS_PASSWORD}

# Draft Configuration
# AI Configuration (Chat / Text)
deepseek.api-key=${DEEPSEEK_API_KEY:}
deepseek.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
deepseek.model=${DEEPSEEK_MODEL:deepseek-v4-flash}
deepseek.connect-timeout=10000
deepseek.read-timeout=120000

