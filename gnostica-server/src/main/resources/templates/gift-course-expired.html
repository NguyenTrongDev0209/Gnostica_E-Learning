<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quà tặng khóa học đã hết hạn</title>
</head>
<body>
    <div style='font-family: Arial, sans-serif; max-width: 600px; margin: auto; padding: 20px; border: 1px solid #ddd; border-radius: 10px; background-color: #ffffff;'>
        <h2 style='color: #e11d48; text-align: center; margin-top: 10px;'>Quà Tặng Hết Hạn</h2>
        <p style='font-size: 16px; color: #333;'>Chào bạn,</p>
        <p style='font-size: 16px; color: #333; line-height: 1.5;'>Quà tặng khóa học <b><span th:text="${courseTitle}">Course</span></b> mà bạn dành cho <b><span th:text="${receiverName}">Người nhận</span></b> đã hết hạn 7 ngày mà chưa có phản hồi.</p>
        
        <p style='font-size: 16px; color: #333; line-height: 1.5;'>Hệ thống đã tự động hủy món quà này và hoàn lại <b><span th:text="${refundAmount}">0</span> VND</b> vào <b>Ví Gnostica</b> của bạn.</p>
        
        <p style='color: #666; font-style: italic; text-align: center; margin-top: 30px;'>Bạn có thể sử dụng số dư này cho các khóa học khác. Cảm ơn bạn!</p>
        <hr style='border: 0; border-top: 1px solid #eee; margin: 20px 0;'>
        <p style='font-size: 12px; color: #999; text-align: center;'>© Gnostica E-Learning.</p>
    </div>
</body>
</html>
