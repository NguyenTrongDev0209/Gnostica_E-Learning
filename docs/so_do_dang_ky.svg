<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 870" width="600" height="870" style="background:#ffffff; font-family: 'Segoe UI', Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>

  <style>
    .title { font-size: 18px; font-weight: bold; fill: #000000; text-anchor: middle; }
    .caption { font-size: 13px; font-style: italic; font-weight: bold; fill: #000000; text-anchor: middle; }
    .node-text { font-size: 13.5px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .decision-text { font-size: 13px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .label-text { font-size: 12px; font-weight: normal; fill: #000000; }
    .line { stroke: #000000; stroke-width: 1.5; fill: none; }
    .action-box { fill: #ffffff; stroke: #000000; stroke-width: 1.5; rx: 8; ry: 8; }
    .decision-box { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
  </style>

  <!-- Title -->
  <text x="300" y="35" class="title">Đăng ký</text>

  <!-- 1. Start Node -->
  <circle cx="300" cy="70" r="13" fill="#000000" stroke="#000000" stroke-width="1.5" />

  <!-- Flow 1 -> 2 -->
  <line x1="300" y1="83" x2="300" y2="115" class="line" marker-end="url(#arrow)" />

  <!-- 2. Action: Đăng ký -->
  <rect x="220" y="115" width="160" height="40" class="action-box" />
  <text x="300" y="135" class="node-text" font-weight="bold">Đăng ký</text>

  <!-- Flow 2 -> 3 -->
  <line x1="300" y1="155" x2="300" y2="185" class="line" marker-end="url(#arrow)" />

  <!-- 3. Action: Nhập thông tin đăng ký -->
  <rect x="195" y="185" width="210" height="42" class="action-box" />
  <text x="300" y="206" class="node-text">Nhập thông tin đăng ký</text>

  <!-- Flow 3 -> 4 -->
  <line x1="300" y1="227" x2="300" y2="255" class="line" marker-end="url(#arrow)" />

  <!-- 4. Decision: data? -->
  <polygon points="300,255 365,290 300,325 235,290" class="decision-box" />
  <text x="300" y="290" class="decision-text">data?</text>

  <!-- Branch NO: data? -> Thông báo lỗi -> Loop back -->
  <line x1="365" y1="290" x2="430" y2="290" class="line" marker-end="url(#arrow)" />
  <text x="385" y="282" class="label-text">no</text>
  
  <rect x="430" y="270" width="120" height="40" class="action-box" />
  <text x="490" y="290" class="node-text">Thông báo lỗi</text>

  <!-- Loop back from error 1 to 'Đăng ký' -->
  <path d="M 490 270 L 490 135 L 380 135" class="line" marker-end="url(#arrow)" />

  <!-- Branch YES: data? -> method(email) send otp -->
  <line x1="300" y1="325" x2="300" y2="365" class="line" marker-end="url(#arrow)" />
  <text x="312" y="348" class="label-text">yes</text>

  <!-- 5. Action: method(email) send otp -->
  <rect x="185" y="365" width="230" height="42" class="action-box" />
  <text x="300" y="386" class="node-text">method(email) send otp</text>

  <!-- Flow 5 -> 6 -->
  <line x1="300" y1="407" x2="300" y2="435" class="line" marker-end="url(#arrow)" />

  <!-- 6. Action: nhập Otp -->
  <rect x="220" y="435" width="160" height="40" class="action-box" />
  <text x="300" y="455" class="node-text">nhập Otp</text>

  <!-- Flow 6 -> 7 -->
  <line x1="300" y1="475" x2="300" y2="505" class="line" marker-end="url(#arrow)" />

  <!-- 7. Decision: Thời hạn otp? -->
  <polygon points="300,505 375,540 300,575 225,540" class="decision-box" />
  <text x="300" y="540" class="decision-text">Thời hạn otp?</text>

  <!-- Branch NO: Thời hạn otp? -> Thông báo lỗi -> Loop back -->
  <line x1="375" y1="540" x2="430" y2="540" class="line" marker-end="url(#arrow)" />
  <text x="392" y="532" class="label-text">no</text>
  
  <rect x="430" y="520" width="120" height="40" class="action-box" />
  <text x="490" y="540" class="node-text">Thông báo lỗi</text>

  <!-- Loop back from error 2 to 'nhập Otp' -->
  <path d="M 490 520 L 490 455 L 380 455" class="line" marker-end="url(#arrow)" />

  <!-- Branch YES: Thời hạn otp? -> thông báo đăng ký thành công -->
  <line x1="300" y1="575" x2="300" y2="615" class="line" marker-end="url(#arrow)" />
  <text x="312" y="598" class="label-text">yes</text>

  <!-- 8. Action: thông báo đăng ký thành công -->
  <rect x="175" y="615" width="250" height="42" class="action-box" />
  <text x="300" y="636" class="node-text">thông báo đăng ký thành công</text>

  <!-- Flow 8 -> 9 -->
  <line x1="300" y1="657" x2="300" y2="685" class="line" marker-end="url(#arrow)" />

  <!-- 9. Action: Login -->
  <rect x="225" y="685" width="150" height="40" class="action-box" />
  <text x="300" y="705" class="node-text">Login</text>

  <!-- Flow 9 -> 10 -->
  <line x1="300" y1="725" x2="300" y2="755" class="line" marker-end="url(#arrow)" />

  <!-- 10. End Node (◉) -->
  <circle cx="300" cy="769" r="14" fill="#ffffff" stroke="#000000" stroke-width="1.6" />
  <circle cx="300" cy="769" r="8" fill="#000000" />

  <!-- Caption -->
  <text x="300" y="825" class="caption">Hình 5.2 Sơ đồ hoạt động chức năng Đăng ký.</text>
</svg>