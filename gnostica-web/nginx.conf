server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not let SPA fallback make probes for secrets look like valid pages.
    # Return 404 instead of revealing whether such files exist.
    location ~* /(?:\.env(?:$|[./])|\.git(?:$|/)|\.svn(?:$|/)|\.ht(?:access|passwd)$) {
        return 404;
    }

    location ~* \.(?:env|pem|key|p12|pfx|bak|sql|dump|sqlite|sqlite3)$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }
}
